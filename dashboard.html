<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard – OfficialRecordsXpress</title>
<link rel="stylesheet" href="vendor/bootstrap-icons/bootstrap-icons.min.css">
<link rel="stylesheet" href="ds/styles.css?v=a11y1">
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--ax-font-base);background:var(--ax-surface-page);color:var(--ax-text-primary);min-height:100vh;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;gap:1rem;min-height:4.5rem;padding:1rem 2rem;background:#0D5257;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.top img{display:block;width:16rem;max-width:55vw;height:auto;filter:brightness(0) invert(1)}
.top a{display:inline-flex;align-items:center;gap:.5rem;color:#fff;font-size:var(--ax-text-sm);font-weight:500;text-decoration:none}
.top a:hover{text-decoration:underline}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:2.5rem 1rem}
.card{width:100%;max-width:32.5rem;background:#fff;border:1px solid var(--ax-border-subtle);border-radius:var(--ax-radius-xl);box-shadow:var(--ax-shadow-xs);padding:2.5rem}
.icon{width:3rem;height:3rem;border-radius:50%;background:var(--ax-success-50);color:var(--ax-success-600);display:flex;align-items:center;justify-content:center;font-size:1.5rem;margin-bottom:1.25rem}
h1{font-size:1.75rem;font-weight:600;margin:0}
p{margin:.625rem 0 0;color:#535862;line-height:1.5}
.foot{display:flex;justify-content:flex-end;gap:1.5rem;padding:1.25rem 2rem 1.5rem;background:#0D5257;font-size:var(--ax-text-sm)}
.foot a{color:rgba(255,255,255,.8);text-decoration:none}
.foot a:hover{color:#fff;text-decoration:underline}
@media (max-width:640px){.top{padding:1rem}.card{padding:1.75rem 1.25rem}.foot{justify-content:center}}
</style>
</head>
<body>
<header class="top">
  <img src="ds/assets/logos/orx-wordmark-color.svg" alt="OfficialRecordsXpress">
  <a href="login.dc.html"><i class="bi bi-box-arrow-right" aria-hidden="true"></i>Log Out</a>
</header>
<main>
  <section class="card">
    <div class="icon"><i class="bi bi-check-lg" aria-hidden="true"></i></div>
    <h1>You’re signed in</h1>
    <p>Welcome to OfficialRecordsXpress. The main dashboard is the next screen to design.</p>
  </section>
</main>
<footer class="foot"><a href="#">Terms &amp; Conditions</a><a href="#">Contact Us</a></footer>
</body>
</html>
