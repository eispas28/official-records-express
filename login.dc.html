        <sc-if value="{{ isPasswordStep }}" hint-placeholder-val="{{ false }}">
          <button type="button" onClick="{{ back }}" style="display: inline-flex; align-items: center; gap: var(--ax-space-2); margin: 0; padding: 0; border: none; background: transparent; font-family: inherit; font-size: 0.8125rem; color: #495057; cursor: pointer; font-weight: 600" style-hover="color:#343A40; text-decoration-line: underline; text-decoration-style: solid"><i class="bi bi-arrow-left" aria-hidden="true"></i>{{ email }}</button>
        </sc-if>
        <h1 id="ax-login-title" style="margin: var(--ax-space-0-5) 0 0; font-size: 1.75rem; line-height: 1.2; font-weight: 600; color: #181D27">{{ title }}</h1>
        <sc-if value="{{ formError }}" hint-placeholder-val="{{ false }}">
          <p role="alert" style="margin: 0; font-size: var(--ax-text-sm); line-height: 1.45; font-weight: 400; color: #E33B32; text-wrap: pretty">{{ formError }}</p>
        </sc-if>
        <sc-if value="{{ showSubtitle }}" hint-placeholder-val="{{ true }}">
          <p style="margin: 0; font-size: 0.9375rem; line-height: 1.5; color: #535862; text-wrap: pretty">{{ subtitle }}</p>
        </sc-if>
      </div>

      <form novalidate="novalidate" onSubmit="{{ submit }}" style="margin-top:1.75rem;display:flex;flex-direction:column;gap:1.125rem">
        <sc-if value="{{ showEmailField }}" hint-placeholder-val="{{ true }}">
        <div style="display:flex;flex-direction:column;gap:var(--ax-space-1-5)">
          <label for="ax-email" style="font-size: var(--ax-text-sm); font-weight: 500; color: #495057">Email <span style="color:#E33B32" aria-hidden="true">*</span></label>
          <input id="ax-email" name="email" type="email" autoComplete="username" required="{{ true }}" placeholder="you@example.com" value="{{ email }}" onChange="{{ setEmail }}" aria-required="true" aria-invalid="{{ emailInvalid }}" aria-describedby="ax-email-err" style="width: 100%; height: 3rem; padding: 0 0.875rem; font-family: inherit; font-size: var(--ax-text-md); color: #495057; background: #fff; border: 1px solid {{ emailBorderColor }}; border-radius: var(--ax-radius-md); outline: none; transition: border-color 200ms ease,box-shadow 200ms ease" style-hover="border-color:#6EA8FE" style-focus="border:2px solid #6EA8FE;padding:0 0.8125rem;background:#fff;box-shadow:0 1px 2px 0 rgba(10,13,18,0.05)">
        </div>
        </sc-if>

        <sc-if value="{{ isPasswordStep }}" hint-placeholder-val="{{ false }}">
        <div style="display:flex;flex-direction:column;gap:var(--ax-space-1-5)">
          <label for="ax-password" style="font-size: var(--ax-text-sm); font-weight: 500; color: #495057">Password <span style="color:#E33B32" aria-hidden="true">*</span></label>
          <div style="display:flex;align-items:center;gap:var(--ax-space-1-5);height:3rem;padding:0 var(--ax-space-1-5) 0 0.875rem;background:#fff;border:1px solid {{ pwBorderColor }};border-radius:var(--ax-radius-md);transition:border-color 200ms ease,box-shadow 200ms ease" style-hover="border-color:#6EA8FE" style-focus-within="border:2px solid #6EA8FE;padding:0 0.3125rem 0 0.8125rem;background:#fff;box-shadow:0 1px 2px 0 rgba(10,13,18,0.05)">
            <input id="ax-password" name="password" type="{{ pwType }}" autoComplete="current-password" required="{{ true }}" placeholder="Enter your password" value="{{ password }}" onChange="{{ setPassword }}" aria-required="true" aria-invalid="{{ pwInvalid }}" aria-describedby="ax-pw-err" style="flex: 1; min-width: 0; height: 100%; border: none; outline: none; background: transparent; font-family: inherit; font-size: var(--ax-text-md); color: #495057">
            <button type="button" onClick="{{ togglePw }}" aria-label="{{ pwToggleLabel }}" aria-pressed="{{ showPw }}" title="{{ pwToggleLabel }}" style="flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;width:2.75rem;height:2.75rem;border:none;border-radius:var(--ax-radius-md);background:transparent;color:#5c6f71;font-size:var(--ax-text-lg);cursor:pointer;transition:background 200ms ease,color 200ms ease" style-hover="background-color:F2F2F2" style-focus="outline:none;box-shadow:0 0 0 3px rgba(0,182,189,.45)"><i class="{{ pwIcon }}" aria-hidden="true"></i></button>
          </div>
          <sc-if value="{{ pwInvalid }}" hint-placeholder-val="{{ false }}"><p id="ax-pw-err" role="alert" style="margin:0;font-size:0.8125rem;color:#E33B32">Enter your password</p></sc-if>
        </div>

        <div style="display:flex;align-items:center;justify-content:flex-start">
          <a href="#" onClick="{{ goForgot }}" style="font-size: var(--ax-text-sm); font-weight: 400; color: #495057; text-decoration: none" style-hover="color:#0D5257;text-decoration:underline">Forgot my password</a>
        </div>
        </sc-if>

        <sc-if value="{{ isCodeStep }}" hint-placeholder-val="{{ false }}">
        <div style="display:flex;flex-direction:column;gap:var(--ax-space-1-5)">
          <label for="ax-code" style="font-size: var(--ax-text-sm); font-weight: 500; color: #495057">Verification code</label>
          <input id="ax-code" name="code" type="text" inputMode="numeric" autoComplete="one-time-code" placeholder="Enter code" value="{{ code }}" onChange="{{ setCode }}" aria-label="Verification code" maxLength="{{ 6 }}" aria-invalid="{{ codeInvalid }}" style="width:100%;height:3rem;padding:0 0.875rem;font-family:inherit;font-size:var(--ax-text-md);letter-spacing:.02em;color:#495057;background:#fff;border:1px solid {{ codeBorderColor }};border-radius:var(--ax-radius-md);outline:none;transition:border-color 200ms ease,box-shadow 200ms ease" style-hover="border-color:#6EA8FE" style-focus="border:2px solid #6EA8FE;padding:0 0.8125rem;box-shadow:0 1px 2px 0 rgba(10,13,18,0.05)">
          <sc-if value="{{ showDemoCode }}" hint-placeholder-val="{{ false }}">
            <p style="margin:0;font-size:0.8125rem;font-weight:500;color:#0D5257">{{ demoCodeText }}</p>
          </sc-if>
          <p style="margin:0;font-size:0.8125rem;color:#535862">Didn’t receive a code? <a href="#" onClick="{{ resendCode }}" style="font-weight: 500; color: #495057; text-decoration: none" style-hover="color: #343A40; font-weight: 600">Resend</a></p>
        </div>
        </sc-if>

        <sc-if value="{{ isChangeStep }}" hint-placeholder-val="{{ false }}">
        <div style="display:flex;flex-direction:column;gap:1.125rem">
          <div style="display:flex;flex-direction:column;gap:var(--ax-space-1-5)">
            <label for="ax-new-pw" style="font-size:var(--ax-text-sm);font-weight:500;color:#495057">New Password <span style="color:#E33B32" aria-hidden="true">*</span></label>
            <div style="display:flex;align-items:center;gap:var(--ax-space-1-5);height:3rem;padding:0 var(--ax-space-1-5) 0 0.875rem;background:#fff;border:1px solid {{ newPwBorderColor }};border-radius:var(--ax-radius-md);transition:border-color 200ms ease,box-shadow 200ms ease" style-hover="border-color:#6EA8FE" style-focus-within="border:2px solid #6EA8FE;padding:0 0.3125rem 0 0.8125rem;box-shadow:0 1px 2px 0 rgba(10,13,18,0.05)">
              <input id="ax-new-pw" name="new-password" type="{{ newPwType }}" autoComplete="new-password" placeholder="Enter your password" value="{{ newPw }}" onChange="{{ setNewPw }}" style="flex:1;min-width:0;height:100%;border:none;outline:none;background:transparent;font-family:inherit;font-size:var(--ax-text-md);color:#495057">
              <button type="button" onClick="{{ toggleNewPw }}" aria-label="{{ newPwToggleLabel }}" title="{{ newPwToggleLabel }}" style="flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;width:2.75rem;height:2.75rem;border:none;border-radius:var(--ax-radius-md);background:transparent;color:#5c6f71;font-size:var(--ax-text-lg);cursor:pointer;transition:background 200ms ease" style-hover="background:#F2F2F2"><i class="{{ newPwIcon }}" aria-hidden="true"></i></button>
            </div>
          </div>
          <div style="display:flex;flex-direction:column;gap:var(--ax-space-1-5)">

            <div style="display:flex;align-items:center;gap:var(--ax-space-1-5);height:3rem;padding:0 var(--ax-space-1-5) 0 0.875rem;background:#fff;border:1px solid {{ confirmPwBorderColor }};border-radius:var(--ax-radius-md);transition:border-color 200ms ease,box-shadow 200ms ease" style-hover="border-color:#6EA8FE" style-focus-within="border:2px solid #6EA8FE;padding:0 0.3125rem 0 0.8125rem;box-shadow:0 1px 2px 0 rgba(10,13,18,0.05)">
              <input id="ax-confirm-pw" name="confirm-password" type="{{ confirmPwType }}" autoComplete="new-password" placeholder="Enter your password" value="{{ confirmPw }}" onChange="{{ setConfirmPw }}" style="flex:1;min-width:0;height:100%;border:none;outline:none;background:transparent;font-family:inherit;font-size:var(--ax-text-md);color:#495057">
              <button type="button" onClick="{{ toggleConfirmPw }}" aria-label="{{ confirmPwToggleLabel }}" title="{{ confirmPwToggleLabel }}" style="flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;width:2.75rem;height:2.75rem;border:none;border-radius:var(--ax-radius-md);background:transparent;color:#5c6f71;font-size:var(--ax-text-lg);cursor:pointer;transition:background 200ms ease" style-hover="background:#F2F2F2"><i class="{{ confirmPwIcon }}" aria-hidden="true"></i></button>
            </div>
          </div>
          <ul style="margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:var(--ax-space-2)">
            <sc-for list="{{ pwRules }}" as="rule" hint-placeholder-count="6">
              <li style="display:flex;align-items:center;gap:0.625rem;font-size:0.8125rem;color:#495057">
                <i class="bi bi-check-lg" aria-hidden="true" style="font-size:0.9375rem;color: {{ rule.color }}"></i>{{ rule.label }}
              </li>
            </sc-for>
          </ul>
        </div>
        </sc-if>

        <button type="submit" style="width:100%;height:3rem;border:none;border-radius:var(--ax-radius-md);background:#0D5257;color:#fff;font-family:inherit;font-size:var(--ax-text-md);font-weight:500;cursor:pointer;box-shadow:0 1px 2px rgba(10,13,18,.06);transition:background 200ms ease,transform 200ms ease,box-shadow 200ms ease" style-hover="background:#0A4145;transform:translateY(-1px);box-shadow:0 6px 16px rgba(0,109,119,.3)" style-active="transform:translateY(0)" style-focus="outline:none;box-shadow:0 0 0 4px rgba(0,182,189,.45)" disabled="{{ submitDisabled }}" aria-busy="{{ loading }}" style-disabled="cursor:default;background:#F1F3F4;color:#98A2A3;transform:none;box-shadow:none">

            <sc-if value="{{ loading }}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="width:1.125rem;height:1.125rem;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:axSpin .7s linear infinite"></span></sc-if>
            {{ submitLabel }}
          </span>
        </button>

        <sc-if value="{{ isRecovery }}" hint-placeholder-val="{{ false }}">
          <button type="button" onClick="{{ backToLogin }}" style="width:100%;height:3rem;background:#fff;border:1px solid #CED4DA;border-radius:var(--ax-radius-md);font-family:inherit;font-size:var(--ax-text-md);font-weight:500;color:#212529;cursor:pointer;box-shadow:0 1px 2px rgba(10,13,18,.05);transition:background 200ms ease,border-color 200ms ease" style-hover="background:#F8F9FA;border-color:#ADB5BD" style-focus="outline:none;box-shadow:0 0 0 4px rgba(0,182,189,.35)">Back to Log In</button>
        </sc-if>

        <sc-if value="{{ showSso }}" hint-placeholder-val="{{ true }}">
          <div style="display:flex;flex-direction:column;gap:1.125rem">
            <div aria-hidden="true" style="display:flex;align-items:center;gap:0.875rem;color:#7b8b8d;font-size:0.8125rem;font-weight:500">
              <span style="flex:1;height:1px;background:#DEE2E6"></span>OR<span style="flex:1;height:1px;background:#DEE2E6"></span>

<script type="text/x-dc" data-dc-script data-props="{&quot;showSso&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Sign-in options&quot;},&quot;accountNotFound&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Error states&quot;},&quot;wrongCredentials&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Error states&quot;},&quot;mfaCodeIncorrect&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Error states&quot;},&quot;resetLinkFails&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Error states&quot;},&quot;codeMismatch&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Error states&quot;},&quot;changeFails&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Error states&quot;}}">
class Component extends DCLogic {
  state = { step: 'email', email: '', password: '', showPw: false, emailInvalid: false, pwInvalid: false, formError: '', loading: false,
            code: '', codeInvalid: false, newPw: '', confirmPw: '', showNewPw: false, showConfirmPw: false, mismatch: false };
  componentWillUnmount() { clearTimeout(this._t); }

  renderVals() {
    const s = this.state;
    const validEmail = s.email.trim().length > 0;
    const raw = s.email.trim();
    const at = raw.indexOf('@');
    const maskedEmail = at > 0 ? raw[0] + '*'.repeat(Math.max(1, at - 1)) + raw.slice(at) : 'your email';
    const titles = { email: 'Log in to your account', password: 'Enter Password', mfa: 'Multi-Factor Authentication', forgot: 'Forgot password?', code: 'Reset password', change: 'Change password' };
    const subtitles = {
      email: 'Welcome back! Please enter your details.',
      password: '',
      mfa: 'Please enter the code we sent to ' + maskedEmail,
      forgot: 'Enter your email & we’ll send you reset instructions.',
      code: 'Enter the code sent to ' + (raw || 'your email'),
      change: 'Set a new password for your account.',
    };
    const p = s.newPw;
    const checks = [
      ['One lowercase character', /[a-z]/.test(p)],
      ['One uppercase character', /[A-Z]/.test(p)],
      ['One number character', /[0-9]/.test(p)],
      ['One special character', /[^A-Za-z0-9]/.test(p)],
      ['11+ characters', p.length >= 11],
      ['Different than previous passwords', p.length > 0 && p !== s.password],
    ];
    const rules = checks.map(([label, met]) => ({ label, met, color: met ? '#1F945C' : '#ADB5BD' }));
    const rulesPass = checks.every(([, met]) => met);
    const labels = { email: 'Next', password: 'Log In', mfa: 'Continue', forgot: 'Send Reset Instructions', code: 'Continue', change: 'Set Password' };
    const loadingLabels = { email: 'Checking…', password: 'Signing in…', mfa: 'Verifying…', forgot: 'Sending…', code: 'Verifying…', change: 'Saving…' };
    return {
      email: s.email,
      password: s.password,
      isEmailStep: s.step === 'email',
      isPasswordStep: s.step === 'password',
      isCodeStep: s.step === 'code' || s.step === 'mfa',
      isChangeStep: s.step === 'change',
      isRecovery: s.step === 'forgot' || s.step === 'code' || s.step === 'change' || s.step === 'mfa',
      showEmailField: s.step === 'email' || s.step === 'forgot',
      title: titles[s.step],
      subtitle: subtitles[s.step],
      showSubtitle: !!subtitles[s.step] && !s.formError,
      formError: s.formError,
      code: s.code,
      newPw: s.newPw,
      confirmPw: s.confirmPw,
      newPwType: s.showNewPw ? 'text' : 'password',
      confirmPwType: s.showConfirmPw ? 'text' : 'password',
      newPwIcon: s.showNewPw ? 'bi bi-eye-slash' : 'bi bi-eye',
      confirmPwIcon: s.showConfirmPw ? 'bi bi-eye-slash' : 'bi bi-eye',
      newPwToggleLabel: s.showNewPw ? 'Hide password' : 'Show password',
      confirmPwToggleLabel: s.showConfirmPw ? 'Hide password' : 'Show password',
      codeInvalid: s.codeInvalid,
      emailBorderColor: s.emailInvalid ? '#E33B32' : '#CED4DA',
      pwBorderColor: s.pwInvalid ? '#E33B32' : '#CED4DA',
      codeBorderColor: s.codeInvalid ? '#E33B32' : '#CED4DA',
      newPwBorderColor: s.mismatch ? '#E33B32' : '#CED4DA',
      confirmPwBorderColor: s.mismatch ? '#E33B32' : '#CED4DA',
      pwRules: rules,
      submitDisabled: s.loading || (s.step === 'forgot' && !s.email.trim()) || ((s.step === 'code' || s.step === 'mfa') && !s.code.trim()) || (s.step === 'change' && !(rulesPass && s.confirmPw.length > 0)),
      goForgot: (e) => { if (e && e.preventDefault) e.preventDefault(); this.setState({ step: 'forgot', password: '', pwInvalid: false, emailInvalid: false, formError: '' }); },
      backToLogin: () => this.setState({ step: 'email', password: '', code: '', newPw: '', confirmPw: '', pwInvalid: false, emailInvalid: false, codeInvalid: false, mismatch: false, formError: '', loading: false }),
      resendCode: (e) => { if (e && e.preventDefault) e.preventDefault(); this.setState({ code: '', codeInvalid: false, formError: '', demoCode: s.step === 'mfa' ? String(Math.floor(100000 + Math.random() * 900000)) : s.demoCode }); },
      showDemoCode: s.step === 'mfa' && !!s.demoCode,
      demoCodeText: 'Prototype code: ' + (s.demoCode || ''),
      setCode: (e) => this.setState({ code: e.target.value, codeInvalid: false, formError: '' }),
      setNewPw: (e) => this.setState({ newPw: e.target.value, mismatch: false, formError: '' }),
      setConfirmPw: (e) => this.setState({ confirmPw: e.target.value, mismatch: false, formError: '' }),
      toggleNewPw: () => this.setState({ showNewPw: !this.state.showNewPw }),
      toggleConfirmPw: () => this.setState({ showConfirmPw: !this.state.showConfirmPw }),
      back: () => this.setState({ step: 'email', password: '', pwInvalid: false, formError: '', loading: false }),
      showPw: s.showPw,
      emailInvalid: s.emailInvalid,
      pwInvalid: s.pwInvalid,
      pwType: s.showPw ? 'text' : 'password',
      pwIcon: s.showPw ? 'bi bi-eye-slash' : 'bi bi-eye',
      pwToggleLabel: s.showPw ? 'Hide password' : 'Show password',
      showSso: this.props.showSso === true && s.step !== 'mfa',
      loading: s.loading,
      submitLabel: s.loading ? loadingLabels[s.step] : labels[s.step],
      ssoGo: (e) => { if (e && e.preventDefault) e.preventDefault(); this.setState({ loading: true }); clearTimeout(this._t); this._t = setTimeout(() => { window.location.href = 'dashboard.html'; }, 600); },
      noop: (e) => { if (e && e.preventDefault) e.preventDefault(); },
      setEmail: (e) => this.setState({ email: e.target.value, emailInvalid: false, formError: '' }),
      setPassword: (e) => this.setState({ password: e.target.value, pwInvalid: false, formError: '' }),
      togglePw: () => this.setState({ showPw: !this.state.showPw }),
      submit: (e) => {
        e.preventDefault();
        if (s.loading) return;
        if (s.step === 'email') {
          if (!validEmail) return this.setState({ emailInvalid: true, formError: 'Enter a valid email address.' });
          if (this.props.accountNotFound) return this.setState({ emailInvalid: true, formError: 'We couldn’t find an account with that username. Try another.' });
          return this.setState({ step: 'password', emailInvalid: false, formError: '' });
        }
        if (s.step === 'forgot') {
          if (!validEmail) return this.setState({ emailInvalid: true, formError: 'Enter a valid email address.' });
          if (this.props.accountNotFound) return this.setState({ emailInvalid: true, formError: 'We couldn’t find an account with that username. Try another.' });
          if (this.props.resetLinkFails) return this.setState({ formError: 'We are having trouble sending your reset link. Please try again.' });
          return this.setState({ step: 'code', emailInvalid: false, formError: '' });
        }
        if (s.step === 'mfa') {
          const entered = s.code.trim();
          if (this.props.mfaCodeIncorrect || (s.demoCode && entered !== s.demoCode)) return this.setState({ codeInvalid: true, formError: 'That code is incorrect. Please try again.' });
          this.setState({ loading: true });
          clearTimeout(this._t);
          this._t = setTimeout(() => { window.location.href = 'dashboard.html'; }, 1200);
          return;
        }
        if (s.step === 'code') {
          if (this.props.codeMismatch) return this.setState({ codeInvalid: true, formError: 'The entered code does not match. Please try again.' });
          return this.setState({ step: 'change', codeInvalid: false, formError: '' });
        }
        if (s.step === 'change') {
          if (s.newPw !== s.confirmPw) return this.setState({ mismatch: true, formError: 'Passwords do not match. Please ensure that both entries are identical and try again.' });
          if (this.props.changeFails) return this.setState({ formError: 'We are having trouble changing your password. Please try again.' });
          this.setState({ loading: true });
          clearTimeout(this._t);
          this._t = setTimeout(() => this.setState({ step: 'email', loading: false, password: '', code: '', newPw: '', confirmPw: '', formError: '' }), 1200);
          return;
        }
        if (s.password.length === 0) return this.setState({ pwInvalid: true, formError: '' });
                this.setState({ loading: true });
        clearTimeout(this._t);
        this._t = setTimeout(() => { window.location.href = 'dashboard.html'; }, 1000);
      },
    };
  }
}
</script>
