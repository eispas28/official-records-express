.it:hover{background:#F1F3F4}.it[aria-current=page]{background:#E9ECEF}
.it i{display:grid;place-items:center;flex:0 0 1.5rem;width:1.5rem;text-align:center;font-size:20px;color:#495057}
.it span{overflow:hidden;opacity:1;transition:opacity 150ms}
#app.c .it span,#app.c .who{opacity:0;pointer-events:none;position:absolute;width:0}
.it:focus-visible,button:focus-visible{outline:3px solid #0D5257;outline-offset:2px}
.tg{flex:0 0 auto;width:2.75rem;height:2.75rem;border:1px solid #CED4DA;border-radius:8px;background:#fff;color:#495057;font-size:16px;cursor:pointer}.tg:hover{background:#F1F3F4}
[data-tip]:hover::after,[data-tip]:focus-visible::after{content:attr(data-tip);position:absolute;left:calc(100% + 10px);top:50%;transform:translateY(-50%);padding:6px 10px;border-radius:6px;background:#181D27;color:#fff;font-size:13px;white-space:nowrap;pointer-events:none;z-index:70}
#app:not(.c) [data-tip]:not(.tg):hover::after,#app:not(.c) [data-tip]:not(.tg):focus-visible::after{display:none}
.um{position:relative;margin-top:14px}
.ub{width:100%;height:4rem;display:flex;align-items:center;gap:12px;padding:0 10px;background:#fff;border:1px solid #CED4DA;border-radius:10px;font-family:inherit;text-align:left;cursor:pointer}.ub:hover{background:#F8F9FA}
.av{flex:0 0 2.5rem;width:2.5rem;height:2.5rem;border-radius:50%;background:#E9ECEF;display:grid;place-items:center;font-weight:600;color:#495057}
.who{min-width:0;white-space:nowrap;font-size:15px;font-weight:600}.who small{display:block;font-size:14px;font-weight:400;color:#495057}
#app.c .ub{height:auto;aspect-ratio:1;padding:0;justify-content:center;gap:0}
#menu{display:none;position:absolute;left:0;bottom:calc(100% + 8px);width:17rem;background:#fff;border:1px solid #E9ECEF;border-radius:12px;box-shadow:0 12px 16px -4px rgba(10,13,18,.08);padding:6px;z-index:60}
#menu.o{display:block}#app.c #menu{left:calc(100% - 3rem)}
#menu .it{height:2.75rem;font-size:15px}
main{position:relative;min-width:0;height:100%;background:#FAFBFC}

iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#FAFBFC;opacity:0;pointer-events:none;transition:opacity 120ms ease-out}
iframe.on{opacity:1;pointer-events:auto}
